name: Validate workbench

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Backend regression tests
        run: python -X utf8 -m unittest discover -s tests -v
      - name: Login script contracts (mocked responses)
        run: node backend/test_auth_scripts.mjs
      - name: Install frontend dependencies
        run: npm ci
      - name: Typecheck and build
        run: npm run build
